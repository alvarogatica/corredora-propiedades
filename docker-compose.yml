services:
  postgres:
    image: postgres:16-alpine
    container_name: corredora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_corredora
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: corredora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: corredora_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@corredora.cl
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
